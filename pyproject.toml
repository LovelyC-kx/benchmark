[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snnbench-research"
version = "0.3.0"
description = "Task-conditional SNN training, state analysis and recovery pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9", "torch>=2.8"]

[project.optional-dependencies]
data = ["h5py>=3.9", "soundfile>=0.12"]

[project.scripts]
snnbench = "snnbench.cli:main"

[tool.setuptools.packages.find]
include = ["snnbench*"]

[tool.setuptools.package-data]
snnbench = ["resources/*.json", "resources/*.csv"]
